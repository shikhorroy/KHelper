# Enable Gradle Configuration Cache, see https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
# Enable Gradle Build Cache, see https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
# The IDE already ships the Kotlin stdlib, see https://plugins.jetbrains.com/docs/intellij/using-kotlin.html
kotlin.stdlib.default.dependency=false
# The Java test runner targets Java 11 on purpose (it runs in the user's project JDK), the Kotlin code targets 21.
kotlin.jvm.target.validation.mode=ignore
# Development only: the Competitive Companion port of the runIde sandbox IDE.
# It is NOT used by a real installation. Installed plugins use the port from Settings (default 10043).
# A different port here stops the sandbox from clashing with KHelper in your main IDE.
# Override once with: ./gradlew runIde -PsandboxPort=10050
sandboxPort=10044
