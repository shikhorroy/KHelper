# Creates a release: merges develop into main, tags it and creates a GitHub Release with the plugin zip.
# Start it from the Actions tab with "Run workflow". Publishing to JetBrains Marketplace is a separate
# workflow (publish.yml), because a release made by this workflow's token cannot start other workflows.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 2.0.0 (creates tag v2.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
    steps:
      - name: Check out develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Check the version and that the tag is new
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version '$VERSION' is not like 1.2.3" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists" >&2
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build develop
        run: ./gradlew test buildPlugin verifyPlugin -PpluginVersion="$VERSION" --console=plain

      - name: Merge develop into main and tag it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge --no-ff origin/develop -m "Release $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin main
          git push origin "$TAG"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$TAG" build/distributions/*.zip
          --title "KHelper $VERSION"
          --generate-notes
          --verify-tag
