# Publishes the plugin to JetBrains Marketplace and attaches the signed zip to its GitHub Release.
# Start it from the Actions tab with "Run workflow" and the release tag, for example v2.0.0.
# It also starts on its own when a person publishes a GitHub Release by hand.
# The tag sets the version: tag v2.0.0 publishes version 2.0.0.
# Needs the repository secrets described in docs/RELEASING.md.
name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v2.0.0"
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read the version from the tag
        id: version
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' is not like v1.2.3" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Test, verify, sign and publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: >-
          ./gradlew test verifyPlugin publishPlugin
          -PpluginVersion=${{ steps.version.outputs.value }}
          --console=plain

      - name: Attach the signed plugin zip to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          files=(build/distributions/*-signed.zip)
          if [ ${#files[@]} -eq 0 ]; then files=(build/distributions/*.zip); fi
          gh release upload "$TAG" "${files[@]}" --clobber
